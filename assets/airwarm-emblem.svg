<!--
  AIRWARM EMBLEM
  Three tapered arcs rotating within a circle: air in motion, heat exchanged.
  One arc per fixed brand promise, clockwise from the top:
      WARMER HOMES  orange  #F28C28
      LOWER BILLS   blue    #2F80ED
      CLEAN ENERGY  green   #63C174
  Flat colour only. No gradient, glow, bevel, shadow or outline.
  Clear space: one quarter of the diameter on all sides.
  Minimum size 16px; below that use airwarm-favicon.svg.
  Do not recolour, rotate, stretch or reorder the arcs.
-->
