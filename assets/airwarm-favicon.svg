<!-- AIRWARM FAVICON — the Corporate Mark, unaltered.

     DERIVED FILE. DO NOT EDIT BY HAND.
     This is a byte-for-byte copy of assets/brand/corporate-mark.svg, kept
     under this name so that the <link rel="icon"> in every page keeps a
     stable, obvious filename.

     Unlike assets/airwarm-mark.svg, this one KEEPS the navy tile the
     supplied artwork paints behind the emblem. A favicon is composited
     against browser chrome of unknown colour, so it needs an opaque
     background of its own.

     The brand rules name the Corporate Mark for the favicon, the loading
     screen, small UI elements, icons, buttons and social profile images.
-->
