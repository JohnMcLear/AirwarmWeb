<?xml version="1.0" encoding="UTF-8"?>
<!--
  ===========================================================================
  AIRWARM — diagram-emitter-comparison.svg
  Four kinds of emitter compared: single panel radiator, double panel radiator,
  fan assisted radiator and underfloor heating. Bar lengths and filled markers
  show proportion only. There are no output figures anywhere on this drawing,
  and none should be added.

  HOW TO CHANGE A LABEL
  Every word a visitor reads sits between <text ...> and </text>. Search this
  file for the words you want to change and type over them. Nothing else has
  to move. Keep labels short: they are set larger on small screens, and a long
  label can run past the edge of the drawing.

  The same wording is repeated in the description below, which is what a
  screen reader announces. If you change a label, change that to match.

  Colours are the approved Airwarm palette only. They are declared once, in
  the style block, and nowhere else in this file.
  ===========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 440"
     role="img"
     aria-labelledby="ec-title ec-desc">

  <title id="ec-title">Emitter types compared</title>
  <desc id="ec-desc">Four kinds of emitter listed one under another: a single panel
    radiator, a double panel radiator, a fan assisted radiator and
    underfloor heating. For each, a bar shows relative heat output for
    a given size, and a row of four markers shows how well it suits a
    lower flow temperature. The single panel has the shortest bar and
    one marker filled. The double panel is longer with two filled. The
    fan assisted radiator has the longest bar with three filled.
    Underfloor heating is between the two with all four filled.
    Everything shown is proportional and illustrative; there are no
    output figures.</desc>

  <style>
    /* ---------------------------------------------------------------------
       AIRWARM DIAGRAM STYLES
       The approved palette, and nothing else:
         navy #071A2B    white #FFFFFF        orange #F28C28
         blue #2F80ED    green #63C174        light neutral #F4F7F9
         mid grey #65717C                     dark text #14212B

       These class names are identical in every Airwarm diagram, so the whole
       set keeps one line weight and one set of type sizes.

       ONE DELIBERATE EXCEPTION, FOR LEGIBILITY.
       The brand orange #F28C28 reaches only 2.3:1 against this pale panel,
       which is below the 3:1 that WCAG asks for a line or a shape that
       carries meaning. So a thin orange LINE on the pale panel is drawn in
       the darker orange #B55F0B (4.6:1), and switches back to #F28C28 on the
       navy panel used by the dark browser theme, where the brand orange
       reaches 7.2:1. Solid orange shapes keep the brand orange and are given
       a navy outline instead, so their edge carries the contrast.
       The same note is in css/airwarm.css and assets/README.md.
       --------------------------------------------------------------------- */
    .d-surface { fill: #F4F7F9; }
    .d-frame   { fill: none; stroke: #071A2B; stroke-width: 1.5; opacity: 0.16; }
    .d-box     { fill: #FFFFFF; stroke: #071A2B; stroke-width: 2; }
    .d-box--quiet { fill: none; stroke: #65717C; stroke-width: 1.5; }
    .d-line    { fill: none; stroke: #071A2B; stroke-width: 2;
                 stroke-linecap: round; stroke-linejoin: round; }
    .d-line--thin { stroke-width: 1.5; }
    .d-line--dash { stroke-dasharray: 6 6; }
    .d-hot     { stroke: #B55F0B; }   /* warmth, and the higher of two temperatures */
    .d-cool    { stroke: #2F80ED; }   /* the cool side, and the lower of two temperatures */
    .d-quiet   { stroke: #65717C; }
    .d-fill-navy  { fill: #071A2B; }
    .d-fill-hot   { fill: #B55F0B; }
    .d-fill-cool  { fill: #2F80ED; }
    .d-fill-quiet { fill: #65717C; }
    .d-fill-white { fill: #FFFFFF; }

    /* TEXT. .d-label is a name, .d-sub an explanatory line, .d-num a number
       inside a step marker, .d-cap a small caption or key entry. */
    .d-label { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 18px; font-weight: 600; fill: #14212B; }
    .d-sub   { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 15px; font-weight: 500; fill: #65717C; }
    .d-num   { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .d-cap   { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 15px; font-weight: 500; fill: #65717C; }

    /* NARROW SCREENS. Below about 520px the explanatory lines are hidden and
       the remaining labels are set larger, so the drawing still reads on a
       phone. Nothing is lost: the page copy carries the detail, and the
       description near the top of this file carries it for screen readers. */
    .d-narrow-only { display: none; }
    @media (max-width: 520px) {
      .d-label { font-size: 24px; }
      .d-num   { font-size: 18px; }
      .d-cap   { font-size: 20px; }
      .d-sub, .d-wide-only { display: none; }
      .d-narrow-only { display: inline; }
    }

    /* DARK BROWSER THEME. The panel turns navy and the ink turns white, so
       the diagram never depends on sitting on a white page. Grey text is
       replaced with the light neutral, because mid grey on navy is only
       3.5:1 and that is not enough for small text. */
    @media (prefers-color-scheme: dark) {
      .d-surface { fill: #071A2B; }
      .d-frame   { stroke: #FFFFFF; opacity: 0.28; }
      .d-box     { fill: #071A2B; stroke: #FFFFFF; }
      .d-line    { stroke: #FFFFFF; }
      .d-hot     { stroke: #F28C28; }
      .d-fill-hot { fill: #F28C28; }
      .d-label   { fill: #FFFFFF; }
      .d-sub, .d-cap { fill: #F4F7F9; }
      .d-fill-navy  { fill: #FFFFFF; }
      .d-fill-white { fill: #071A2B; }
      .d-num        { fill: #071A2B; }
    }

    /* Extra styles for this diagram only. */
    .d-bar  { fill: #2F80ED; }
    .d-pip  { fill: #071A2B; }
    .d-pip-empty { fill: none; stroke: #65717C; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) { .d-pip { fill: #FFFFFF; } }
  </style>

  <defs>
    <!-- Arrowheads. One per colour, so each takes the dark theme change with
         its line. There is no need to change these. -->
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-navy" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-hot" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrow-cool" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-cool" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrow-quiet" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-quiet" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <!-- The diagram carries its own background panel, so it stays legible on a
       white, a pale grey or a navy section. -->
  <rect class="d-surface" x="0" y="0" width="640" height="440" rx="12"/>
  <rect class="d-frame" x="0.75" y="0.75" width="638.5" height="438.5" rx="11.25"/>

  <!-- ======================= COLUMN HEADINGS =========================== -->
  <text class="d-label" x="252" y="52">Heat output</text>
  <text class="d-sub"   x="252" y="72">for a given size</text>
  <text class="d-label d-wide-only"   x="452" y="52">Suits a lower flow</text>
  <text class="d-label d-wide-only"   x="452" y="72">temperature</text>
  <text class="d-label d-narrow-only" x="452" y="46">Lower flow</text>
  <text class="d-label d-narrow-only" x="452" y="74">temperature</text>
  <path class="d-line d-line--thin d-quiet" d="M20 88 H620"/>

  <!-- ======================= 1. SINGLE PANEL =========================== -->
  <text class="d-label" x="176" y="132" text-anchor="end">Single panel</text>
  <rect class="d-box" x="192" y="112" width="44" height="30" rx="3"/>
  <path class="d-line d-line--thin" d="M203 112 V142"/>
  <path class="d-line d-line--thin" d="M214 112 V142"/>
  <path class="d-line d-line--thin" d="M225 112 V142"/>
  <rect class="d-bar" x="252" y="118" width="70" height="16" rx="3"/>
  <circle class="d-pip" cx="459" cy="126" r="7"/>
  <circle class="d-pip-empty" cx="483" cy="126" r="7"/>
  <circle class="d-pip-empty" cx="507" cy="126" r="7"/>
  <circle class="d-pip-empty" cx="531" cy="126" r="7"/>

  <!-- ======================= 2. DOUBLE PANEL =========================== -->
  <text class="d-label" x="176" y="212" text-anchor="end">Double panel</text>
  <rect class="d-box" x="192" y="186" width="44" height="30" rx="3"/>
  <rect class="d-box" x="198" y="196" width="44" height="30" rx="3"/>
  <path class="d-line d-line--thin" d="M209 196 V226"/>
  <path class="d-line d-line--thin" d="M220 196 V226"/>
  <path class="d-line d-line--thin" d="M231 196 V226"/>
  <rect class="d-bar" x="252" y="198" width="120" height="16" rx="3"/>
  <circle class="d-pip" cx="459" cy="206" r="7"/>
  <circle class="d-pip" cx="483" cy="206" r="7"/>
  <circle class="d-pip-empty" cx="507" cy="206" r="7"/>
  <circle class="d-pip-empty" cx="531" cy="206" r="7"/>

  <!-- ======================= 3. FAN ASSISTED =========================== -->
  <text class="d-label" x="176" y="292" text-anchor="end">Fan assisted</text>
  <rect class="d-box" x="192" y="264" width="44" height="26" rx="3"/>
  <path class="d-line d-line--thin" d="M205 264 V290"/>
  <path class="d-line d-line--thin" d="M223 264 V290"/>
  <circle class="d-line d-line--thin" cx="205" cy="301" r="8" fill="none"/>
  <circle class="d-line d-line--thin" cx="223" cy="301" r="8" fill="none"/>
  <rect class="d-bar" x="252" y="278" width="168" height="16" rx="3"/>
  <circle class="d-pip" cx="459" cy="286" r="7"/>
  <circle class="d-pip" cx="483" cy="286" r="7"/>
  <circle class="d-pip" cx="507" cy="286" r="7"/>
  <circle class="d-pip-empty" cx="531" cy="286" r="7"/>

  <!-- ======================= 4. UNDERFLOOR ============================= -->
  <text class="d-label" x="176" y="372" text-anchor="end">Underfloor</text>
  <path class="d-line d-line--thin" d="M190 352 H240"/>
  <path class="d-line d-line--thin" d="M192 370 q8 -12 16 0 q8 12 16 0 q8 -12 16 0"/>
  <path class="d-line d-line--thin" d="M190 384 H240"/>
  <rect class="d-bar" x="252" y="358" width="140" height="16" rx="3"/>
  <circle class="d-pip" cx="459" cy="366" r="7"/>
  <circle class="d-pip" cx="483" cy="366" r="7"/>
  <circle class="d-pip" cx="507" cy="366" r="7"/>
  <circle class="d-pip" cx="531" cy="366" r="7"/>

  <!-- ======================= CAPTION ====================================
       Please keep this caption. The bars carry proportion only.
       =================================================================== -->
  <text class="d-cap" x="320" y="412" text-anchor="middle">Proportions are illustrative.</text>
  <text class="d-cap" x="320" y="432" text-anchor="middle">Bar lengths are not output figures.</text>
</svg>
