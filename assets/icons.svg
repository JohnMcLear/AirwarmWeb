             a6 6 0 0 1 -7.9 7.9 l-6.9 6.9 a2.1 2.1 0 0 1 -3 -3 l6.9 -6.9
             a6 6 0 0 1 7.9 -7.9 Z"/>
  </symbol>

  <symbol id="icon-commission" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <title>Commissioning</title>
    <path d="M3.6 17.4 a8.4 8.4 0 1 1 16.8 0"/>
    <path d="M12 17.4 L16.6 11.6"/>
    <path d="M12 17.3 L12 17.5"/>
    <path d="M3.6 17.4 H6.2"/>
    <path d="M17.8 17.4 H20.4"/>
