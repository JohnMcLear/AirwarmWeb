<?xml version="1.0" encoding="UTF-8"?>
<!--
  ===========================================================================
  AIRWARM — icons.svg
  One sprite holding the whole icon family. Twenty line icons, all drawn on a
  24 by 24 grid with a 1.5 pixel stroke, rounded ends and no fills, so they
  sit together as one set.

  HOW TO USE ONE
  In a page, put an empty svg with a use element inside it, and name the icon
  you want:

      <svg class="aw-icon" aria-hidden="true" focusable="false">
        <use href="/assets/icons.svg#icon-home"></use>
      </svg>

  The icon takes the colour of the surrounding text, because every shape is
  drawn with stroke="currentColor". There is a larger size as well: its class
  name is written out in assets/README.md. (It cannot be printed here, because
  an XML comment is not allowed to contain two hyphens in a row and the class
  name has exactly that in the middle of it.)

  Keep aria-hidden="true" whenever the icon sits next to a word that already
  says the same thing, which is nearly always. If an icon is on its own with no
  label, give the svg role="img" and an aria-label instead.

  If you would rather not load a second file, paste the whole of this sprite
  in once, immediately after the opening body tag, inside a wrapper with
  style="display:none", and the same use elements will find it.

  THE TWENTY IDs
    icon-home           icon-radiator      icon-check      icon-clock
    icon-survey         icon-cylinder      icon-question   icon-document
    icon-design         icon-outdoor-unit  icon-warning    icon-arrow-right
    icon-install        icon-controls      icon-email
    icon-commission     icon-solar         icon-location
    icon-service        icon-battery

  This file has no colour in it at all, which is why it needs no palette
  block: the page decides the colour. Please keep it that way.

  Accessibility note: the root svg below is marked aria-hidden because a
  sprite is a container, not a picture. The picture is the use element on the
  page, and that is where role, title or aria-label belong. Every symbol still
  carries a title so the shapes are named for anyone reading the file.
  ===========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">

  <!-- ================= JOURNEY AND SERVICE ================= -->

  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
