    <path d="M6.6 8 H12.4"/>
    <path d="M6.6 11.2 H10.6"/>
    <circle cx="16.2" cy="15" r="4.2"/>
    <path d="M19.2 18 L21.6 20.4"/>
  </symbol>

  <symbol id="icon-design" viewBox="0 0 24 24" fill="none" stroke="currentColor"
