<?xml version="1.0" encoding="UTF-8"?>
<!--
  ===========================================================================
  AIRWARM — diagram-cylinder-siting.svg
  Where a hot water cylinder can go, and the space it needs around it. The
  clearances shown are the ones that matter in practice: room above for the
  controls and the immersion, room in front to work, and room at the side for
  pipework. No dimensions are given: they come from the cylinder chosen and
  from the manufacturer's instructions.

  HOW TO CHANGE A LABEL
  Every word a visitor reads sits between <text ...> and </text>. Search this
  file for the words you want to change and type over them. Nothing else has
  to move. Keep labels short: they are set larger on small screens, and a long
  label can run past the edge of the drawing.

  The same wording is repeated in the description below, which is what a
  screen reader announces. If you change a label, change that to match.

  Colours are the approved Airwarm palette only. They are declared once, in
  the style block, and nowhere else in this file.
  ===========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 560"
     role="img"
     aria-labelledby="cs-title cs-desc">

  <title id="cs-title">Where a hot water cylinder can go, and the space it needs</title>
  <desc id="cs-desc">Two parts. The first shows a cylinder standing in a cupboard, with the
    space it needs marked around it: room above it, room in front of
    it to work, room at the side for pipework, and a solid level floor
    underneath. The second shows the three places a cylinder usually
    goes: an airing cupboard, a loft, or a utility room. No dimensions
    are given, because they depend on the cylinder chosen and on the
    manufacturer's instructions.</desc>

  <style>
    /* ---------------------------------------------------------------------
       AIRWARM DIAGRAM STYLES
       The approved palette, and nothing else:
         navy #010F23    white #FFFFFF        orange #F76201
         blue #017FE1    green #689E14        light neutral #F4F7F9
         mid grey #65717C                     dark text #14212B

       These class names are identical in every Airwarm diagram, so the whole
       set keeps one line weight and one set of type sizes.

       ONE DELIBERATE EXCEPTION, FOR LEGIBILITY.
       The brand orange #F76201 reaches only 2.9:1 against this pale panel,
       which is below the 3:1 that WCAG asks for a line or a shape that
       carries meaning. So a thin orange LINE on the pale panel is drawn in
       the darker orange #C14D01 (4.5:1), and switches back to #F76201 on the
       navy panel used by the dark browser theme, where the brand orange
       reaches 6.1:1. Solid orange shapes keep the brand orange and are given
       a navy outline instead, so their edge carries the contrast.
       The same note is in css/airwarm.css and assets/README.md.
       --------------------------------------------------------------------- */
    .d-surface { fill: #F4F7F9; }
    .d-frame   { fill: none; stroke: #010F23; stroke-width: 1.5; opacity: 0.16; }
    .d-box     { fill: #FFFFFF; stroke: #010F23; stroke-width: 2; }
    .d-box--quiet { fill: none; stroke: #65717C; stroke-width: 1.5; }
    .d-line    { fill: none; stroke: #010F23; stroke-width: 2;
                 stroke-linecap: round; stroke-linejoin: round; }
    .d-line--thin { stroke-width: 1.5; }
    .d-line--dash { stroke-dasharray: 6 6; }
    .d-hot     { stroke: #C14D01; }   /* warmth, and the higher of two temperatures */
    .d-cool    { stroke: #017FE1; }   /* the cool side, and the lower of two temperatures */
    .d-quiet   { stroke: #65717C; }
    .d-fill-navy  { fill: #010F23; }
    .d-fill-hot   { fill: #C14D01; }
    .d-fill-cool  { fill: #017FE1; }
    .d-fill-quiet { fill: #65717C; }
    .d-fill-white { fill: #FFFFFF; }

    /* TEXT. .d-label is a name, .d-sub an explanatory line, .d-num a number
       inside a step marker, .d-cap a small caption or key entry. */
    .d-label { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 18px; font-weight: 600; fill: #14212B; }
    .d-sub   { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 15px; font-weight: 500; fill: #65717C; }
    .d-num   { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .d-cap   { font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
               font-size: 15px; font-weight: 500; fill: #65717C; }

    /* NARROW SCREENS. Below about 520px the explanatory lines are hidden and
       the remaining labels are set larger, so the drawing still reads on a
       phone. Nothing is lost: the page copy carries the detail, and the
       description near the top of this file carries it for screen readers. */
    .d-narrow-only { display: none; }
    @media (max-width: 520px) {
      .d-label { font-size: 24px; }
      .d-num   { font-size: 18px; }
      .d-cap   { font-size: 20px; }
      .d-sub, .d-wide-only { display: none; }
      .d-narrow-only { display: inline; }
    }

    /* DARK BROWSER THEME. The panel turns navy and the ink turns white, so
       the diagram never depends on sitting on a white page. Grey text is
       replaced with the light neutral, because mid grey on navy is only
       3.9:1 and that is not enough for small text. */
    @media (prefers-color-scheme: dark) {
      .d-surface { fill: #010F23; }
      .d-frame   { stroke: #FFFFFF; opacity: 0.28; }
      .d-box     { fill: #010F23; stroke: #FFFFFF; }
      .d-line    { stroke: #FFFFFF; }
      .d-hot     { stroke: #F76201; }
      .d-fill-hot { fill: #F76201; }
      .d-label   { fill: #FFFFFF; }
      .d-sub, .d-cap { fill: #F4F7F9; }
      .d-fill-navy  { fill: #FFFFFF; }
      .d-fill-white { fill: #010F23; }
      .d-num        { fill: #010F23; }
    }

    /* Extra styles for this diagram only. */
    .d-dim { fill: none; stroke: #017FE1; stroke-width: 1.5; }
  </style>

  <defs>
    <!-- Arrowheads. One per colour, so each takes the dark theme change with
         its line. There is no need to change these. -->
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-navy" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-hot" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrow-cool" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-cool" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrow-quiet" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-fill-quiet" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <!-- The diagram carries its own background panel, so it stays legible on a
       white, a pale grey or a navy section. -->
  <rect class="d-surface" x="0" y="0" width="640" height="560" rx="12"/>
  <rect class="d-frame" x="0.75" y="0.75" width="638.5" height="558.5" rx="11.25"/>

  <!-- ======================= PART ONE: THE SPACE IT NEEDS =============== -->
  <text class="d-label" x="320" y="38" text-anchor="middle">The space it needs</text>

  <!-- The cupboard, and the cylinder standing in it -->
  <rect class="d-box--quiet" x="200" y="60" width="240" height="270" rx="4"/>
  <rect class="d-box" x="262" y="130" width="100" height="190" rx="12"/>
  <path class="d-line d-line--thin" d="M262 166 H362"/>
  <path class="d-line d-line--thin" d="M262 288 H362"/>
  <path class="d-line d-line--thin" d="M312 118 V130"/>
  <circle class="d-line d-line--thin" cx="312" cy="228" r="14" fill="none"/>

  <!-- Room above -->
  <path class="d-dim" d="M312 70 V124"
        marker-start="url(#arrow-cool)" marker-end="url(#arrow-cool)"/>
  <text class="d-label" x="452" y="100">Room above</text>
  <text class="d-sub"   x="452" y="120">controls and immersion</text>

  <!-- Room in front -->
  <path class="d-dim" d="M368 250 H434"
        marker-start="url(#arrow-cool)" marker-end="url(#arrow-cool)"/>
  <text class="d-label" x="452" y="212">Room in front</text>
  <text class="d-sub"   x="452" y="232">to work on it</text>

  <!-- Room at the side for pipework -->
  <path class="d-dim" d="M206 250 H256"
        marker-start="url(#arrow-cool)" marker-end="url(#arrow-cool)"/>
  <text class="d-label" x="188" y="244" text-anchor="end">Pipework</text>
  <text class="d-sub"   x="188" y="264" text-anchor="end">room at the side</text>

  <!-- The floor underneath -->
  <path class="d-line" d="M190 330 H450"/>
  <text class="d-label" x="320" y="360" text-anchor="middle">A solid, level floor</text>

  <path class="d-line d-line--thin d-quiet" d="M40 382 H600"/>

  <!-- ======================= PART TWO: WHERE IT CAN GO ================== -->
  <text class="d-label" x="320" y="412" text-anchor="middle">Where it can go</text>

  <!-- An airing cupboard: a cylinder beside shelves -->
  <rect class="d-box" x="50" y="428" width="160" height="76" rx="6"/>
  <rect class="d-box--quiet" x="70" y="440" width="40" height="52" rx="6"/>
  <path class="d-line d-line--thin" d="M126 452 H196"/>
  <path class="d-line d-line--thin" d="M126 470 H196"/>
  <path class="d-line d-line--thin" d="M126 488 H196"/>
  <text class="d-label" x="130" y="530" text-anchor="middle">Airing</text>
  <text class="d-label" x="130" y="552" text-anchor="middle">cupboard</text>

  <!-- A loft: a roof outline with a cylinder under it -->
  <rect class="d-box" x="240" y="428" width="160" height="76" rx="6"/>
  <path class="d-line d-line--thin" d="M256 490 L320 442 L384 490"/>
  <rect class="d-box--quiet" x="308" y="464" width="24" height="26" rx="6"/>
  <text class="d-label" x="320" y="530" text-anchor="middle">Loft</text>

  <!-- A utility room: a worktop with a cylinder beside it -->
  <rect class="d-box" x="430" y="428" width="160" height="76" rx="6"/>
  <path class="d-line d-line--thin" d="M446 458 H520 V492"/>
  <rect class="d-box--quiet" x="540" y="444" width="30" height="48" rx="6"/>
  <text class="d-label" x="510" y="530" text-anchor="middle">Utility</text>
  <text class="d-label" x="510" y="552" text-anchor="middle">room</text>
</svg>
